name: publish

on:
  schedule:
    - cron: "17 3 * * *"
    # GitHub drops and delays scheduled runs; later slots retry, and skip publishing once the snapshot is live.
    - cron: "47 9 * * *"
    - cron: "23 15 * * *"
    - cron: "53 20 * * *"
  workflow_dispatch:
    inputs:
      allow_delta:
        description: Accept size, churn and concentration anomalies
        type: boolean
        default: false
      bootstrap:
        description: First publish (no data branch yet)
        type: boolean
        default: false
      allow_rollback:
        description: Accept a snapshot no newer than the published build
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    # Explicit bash runs with pipefail; the implicit default would let `check | tee` hide a failing gate.
    shell: bash

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-24.04
    environment: publish
    timeout-minutes: 20
    permissions:
      contents: read # read main and the previous data branch
    outputs:
      day: ${{ steps.meta.outputs.day }}
      generated: ${{ steps.meta.outputs.generated }}
      sha: ${{ steps.src.outputs.sha }}
      live: ${{ steps.meta.outputs.live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Record source commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect data branch
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          rc=0
          git -c http.extraheader="$auth" ls-remote --exit-code --heads origin data > /dev/null || rc=$?
          case "$rc" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) [ "$BOOTSTRAP" = true ] || { echo "::error::no data branch; run with bootstrap=true for the first publish"; exit 1; }
               echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed ($rc)"; exit 1 ;;
          esac

      - name: Check out previous data
        if: steps.prev.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: prev
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publish.txt

      - name: Install tools
        run: |
          pip install --require-hashes -r requirements-publish.txt
          sudo apt-get update -o Acquire::Retries=5 -qq
          sudo apt-get install -o Acquire::Retries=5 -y -qq --no-install-recommends nftables suricata

      - name: Fetch snapshot
        env:
          MIRAGE_FEED_TOKEN: ${{ secrets.MIRAGE_FEED_TOKEN }}
          MIRAGE_FEED_URL: ${{ vars.MIRAGE_FEED_URL || 'https://mirage.offseq.com/api/feed/community' }}
        run: python -m generator fetch --out snapshot.json

      - name: Build
        env:
          PREV: ${{ steps.prev.outputs.exists }}
        run: |
          args=()
          if [ "$PREV" = true ]; then args+=(--previous prev); fi
          python -m generator build --snapshot snapshot.json --out out "${args[@]}"

      - name: Export day
        id: meta
        run: |
          day=$(jq -r .day out/feed.json)
          generated=$(jq -r .generated out/feed.json)
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid day"; exit 1; }
          [[ "$generated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo "::error::invalid generated"; exit 1; }
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "generated=$generated" >> "$GITHUB_OUTPUT"
          live=false
          # Both mirrors must already serve it: a run that failed between the data push and the R2 flip must retry.
          edge=$(curl -fsS --retry 3 https://feeds.offseq.com/mirage-feed/feed.json | jq -r .generated) || edge=
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -f prev/feed.json ] && [ "$(jq -r .generated prev/feed.json)" = "$generated" ] \
            && [ "$edge" = "$generated" ]; then
            live=true
            echo "::notice::snapshot $generated is already published; skipping publish"
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"

      - name: Safety gates
        id: gates
        continue-on-error: true
        env: &gates
          PREV: ${{ steps.prev.outputs.exists }}
          ALLOW_DELTA: ${{ inputs.allow_delta }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
          MIRAGE_LEAK_PATTERNS: ${{ secrets.MIRAGE_LEAK_PATTERNS }}
          MIRAGE_LEAK_LITERALS: ${{ secrets.MIRAGE_LEAK_LITERALS }}
        run: |
          args=(--require-leak-rules)
          if [ "$PREV" = true ]; then args+=(--previous prev); else args+=(--bootstrap); fi
          if [ "$ALLOW_DELTA" = true ]; then args+=(--allow-delta); fi
          if [ "$ALLOW_ROLLBACK" = true ]; then args+=(--allow-rollback); fi
          printf '%s\0' "${args[@]}" > "$RUNNER_TEMP/gate-args"
          python -m generator check out "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/gates.log"

      # Anomaly gates compare against the published build, which stays put while they fail; a shift the
      # previous snapshot day already showed is real and must not keep the feed stale.
      - name: Fetch previous snapshot day
        if: steps.gates.outcome == 'failure' && steps.prev.outputs.exists == 'true' && inputs.allow_delta != true
        env:
          DAY: ${{ steps.meta.outputs.day }}
          MIRAGE_FEED_TOKEN: ${{ secrets.MIRAGE_FEED_TOKEN }}
          MIRAGE_FEED_URL: ${{ vars.MIRAGE_FEED_URL || 'https://mirage.offseq.com/api/feed/community' }}
        run: python -m generator fetch --day "$(date -u -d "$DAY - 1 day" +%F)" --out prev-day.json

      - name: Confirm sustained shift
        if: steps.gates.outcome == 'failure'
        env: *gates
        run: |
          [ -f prev-day.json ] || { echo "::error::safety gates failed"; exit 1; }
          python -m generator build --snapshot prev-day.json --out prev-day
          mapfile -d '' args < "$RUNNER_TEMP/gate-args"
          python -m generator check out "${args[@]}" --confirm-with prev-day 2>&1 | tee "$RUNNER_TEMP/gates.log"

      - name: Keep gate failures
        if: failure()
        run: grep '^FAIL ' "$RUNNER_TEMP/gates.log" > gates.txt || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: gates
          path: gates.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate with upstream tools
        run: |
          # 103 flags UUIDv5 ids and 302 hashless ATT&CK URLs; both are deliberate.
          stix2_validator --disable 103,302 out/latest/stix/mirage.json
          sudo nft -c -f out/latest/nft/mirage.nft
          s="$PWD/out/latest/suricata"
          suricata -T --init-errors-fatal -l "$RUNNER_TEMP" -S "$s/mirage.rules" \
            --set reputation-categories-file="$s/categories.txt" \
            --set default-reputation-path="$s" \
            --set reputation-files.0=mirage-iprep.list

      - name: Render README and spotlight
        run: |
          mkdir dist
          cp README.md dist/README.md
          python -m generator readme --snapshot snapshot.json --template docs/README.template.md --readme dist/README.md
          python -m generator spotlight --snapshot snapshot.json > dist/notes.md
          # The weekly archive carries no IP lists.
          tar --zstd -cf dist/spotlight.tar.zst -C out stats.json feed.json latest/urls-7d.txt latest/domains-7d.txt \
            latest/hashes-sha256-30d.txt latest/cves-7d.csv latest/fingerprints.csv latest/hassh.csv \
            -C ../dist notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed
          path: |
            out
            dist
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Sign and publish
    needs: build
    if: needs.build.outputs.live != 'true'
    runs-on: ubuntu-24.04
    environment: publish
    timeout-minutes: 15
    permissions:
      contents: write # README stats commit and release on main; data branch goes through the deploy key
      id-token: write # build provenance attestation
      attestations: write
    env:
      DAY: ${{ needs.build.outputs.day }}
      GENERATED: ${{ needs.build.outputs.generated }}
      SHA: ${{ needs.build.outputs.sha }}
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Validate build outputs
        run: |
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid day"; exit 1; }
          [[ "$GENERATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo "::error::invalid generated"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid source sha"; exit 1; }

      # The commit the build used: the spotlight tag points at it and the README commit is rebased onto main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0 # the README rebase needs the build commit's place in main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed
          path: .

      - name: Install minisign
        run: |
          sudo apt-get update -o Acquire::Retries=5 -qq
          sudo apt-get install -o Acquire::Retries=5 -y -qq --no-install-recommends minisign

      - name: Sign checksums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_KEY" > "$key")
          minisign -S -s "$key" -m out/SHA256SUMS -x out/SHA256SUMS.minisig -t "mirage-feed $DAY generated $GENERATED" < /dev/null
          rm -f "$key"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/SHA256SUMS

      - name: Upload build to R2
        env: &r2
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the CRC checksums newer AWS CLIs send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          BUCKET: mirage-feed
        run: |
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::R2_ACCOUNT_ID missing or malformed"; exit 1; }
          R2_ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" scripts/r2-publish.sh upload out

      - name: Load deploy key
        env:
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          (umask 077 && printf '%s\n' "$DATA_DEPLOY_KEY" > "$key")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Publish data branch
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/data.index"
          export GIT_AUTHOR_NAME="$BOT_NAME" GIT_AUTHOR_EMAIL="$BOT_EMAIL"
          export GIT_COMMITTER_NAME="$BOT_NAME" GIT_COMMITTER_EMAIL="$BOT_EMAIL"
          git -C out --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add -A -f .
          commit=$(git commit-tree "$(git write-tree)" -m "data: $DAY")
          git push --force git@github.com:offseq/mirage-feed.git "${commit}:refs/heads/data"

      # Readers switch only once R2 and the data branch both hold the build.
      - name: Switch R2 to the build
        env: *r2
        run: R2_ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" scripts/r2-publish.sh flip out

      - name: Weekly spotlight release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%u)" = 1 ] || exit 0
          tag="spotlight-$(date -u +%G-%V)"
          gh release view "$tag" > /dev/null 2>&1 && exit 0
          mv dist/spotlight.tar.zst "dist/mirage-feed-spotlight-$DAY.tar.zst"
          # A run that pushed the tag but failed to create the release must not be blocked by its own tag.
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null \
            || git push git@github.com:offseq/mirage-feed.git "HEAD:refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "Mirage spotlight $tag" --notes-file dist/notes.md \
            "dist/mirage-feed-spotlight-$DAY.tar.zst" out/SHA256SUMS out/SHA256SUMS.minisig

      - name: Update README stats
        run: |
          export GIT_AUTHOR_NAME="$BOT_NAME" GIT_AUTHOR_EMAIL="$BOT_EMAIL" GIT_COMMITTER_NAME="$BOT_NAME" GIT_COMMITTER_EMAIL="$BOT_EMAIL"
          cp dist/README.md README.md
          git diff --quiet -- README.md && exit 0
          git commit -m "readme: stats for $DAY" -- README.md
          # A human push between the rebase and the push is retried rather than failing a live publish.
          for _ in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 20; done
          exit 1

  notify:
    name: Track failures
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD: ${{ needs.build.result }}
      PUBLISH: ${{ needs.publish.result }}
      LABEL: publish-failure
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'schedule' && (needs.build.result == 'failure' || needs.publish.result == 'failure')
        continue-on-error: true
        with:
          name: gates
          path: gates

      - name: Open or update the failure issue
        if: github.event_name == 'schedule' && (needs.build.result == 'failure' || needs.publish.result == 'failure')
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "Scheduled publish failed: $run_url"
            echo
            if [ -s gates/gates.txt ]; then
              echo "Failing gates:"
              echo
              # Indented code block: gate output cannot break out of it or mention anyone.
              head -n 50 gates/gates.txt | cut -c1-300 | sed 's/^/    /'
            else
              echo "No gate failures recorded (build: $BUILD, publish: $PUBLISH); see the run log."
            fi
          } > body.md
          gh label create "$LABEL" --force --color B60205 --description "Scheduled feed publish failed"
          issue=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file body.md
          else
            gh issue create --title "Scheduled feed publish is failing" --label "$LABEL" --body-file body.md
          fi

      - name: Close the failure issue
        if: needs.publish.result == 'success'
        run: |
          issue=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          [ -z "$issue" ] || gh issue close "$issue" --comment "Published in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
