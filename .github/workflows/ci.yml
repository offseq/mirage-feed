name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check generator tests
      - run: ruff format --check generator tests
      - run: pytest -q
      - name: Build and gate the fixture
        env:
          MIRAGE_LEAK_PATTERNS: "zz_ci_marker_[0-9a-f]{8}"
        run: |
          python -m generator build --snapshot tests/fixtures/snapshot.json --out out --allowlist tests/fixtures/allowlist.txt
          python -m generator check out --allowlist tests/fixtures/allowlist.txt --bootstrap --require-leak-rules
