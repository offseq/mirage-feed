version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      # requirements-dev.txt and requirements-publish.txt share this directory and pins; one PR recompiles both.
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      vitest:
        patterns: ["vitest", "vite-node", "@vitest/*"]
      dev-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Majors change CLI and deploy defaults; upgrade deliberately.
      - dependency-name: wrangler
        update-types: ["version-update:semver-major"]
      # Each major is the peer of a wrangler major; move both together.
      - dependency-name: "@cloudflare/workers-types"
        update-types: ["version-update:semver-major"]
      # Tracks the Node 22 runtime (engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
