name = "mirage-feed-site"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

routes = [{ pattern = "feeds.offseq.com", custom_domain = true }]

rules = [{ type = "Data", globs = ["**/*.woff2", "**/*.png", "**/*.ico"], fallthrough = false }]

r2_buckets = [{ binding = "FEED", bucket_name = "mirage-feed" }]

analytics_engine_datasets = [{ binding = "FETCHES", dataset = "mirage_feed_fetches" }]

# Request URLs carry looked-up addresses (/ip/<addr>), so Workers Logs stay off.
[observability]
enabled = false

# Wrangler 3 has no first-class [[ratelimits]]. Windows are 10 s or 60 s only; the hourly removal cap is enforced upstream via X-Feed-Client-IP.
[[unsafe.bindings]]
name = "REMOVAL_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "LOOKUP_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Staleness alerts; the destination must be a verified Email Routing address.
send_email = [{ name = "ALERT", destination_address = "npu+platforms@offseq.com" }]

[triggers]
crons = ["0 7,19 * * *"]

[vars]
ALERT_TO = "npu+platforms@offseq.com"
SHADOW = "0"
REMOVAL_UPSTREAM = "https://mirage.offseq.com/api/feed/removal"
GITHUB_REPO = "offseq/mirage-feed"
GITHUB_REF = "data"
TURNSTILE_SITEKEY = "0x4AAAAAAFi-F5MxBaDk0zXN"

# Secrets (npx wrangler secret put <NAME>):
#   TURNSTILE_SECRET   Turnstile secret key for TURNSTILE_SITEKEY
#   FEED_PROXY_SECRET  shared secret sent upstream as X-Feed-Proxy-Secret
#   SHADOW_AUTH        user:pass for the Basic-auth gate while SHADOW = "1"
